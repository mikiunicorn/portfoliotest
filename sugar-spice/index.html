<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugar & Spice — Personalized Cake Gifts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --pink:#FF2D78;--pink-dark:#D4005A;
      --ink:#1A1A1A;--ink-soft:#2E2E2E;
      --gray-bg:#EBEBEB;--gray-card:#F5F5F5;--gray-mid:#D8D8D8;--gray-light:#E4E4E4;
      --white:#FFFFFF;--muted:#6B6B6B;--muted-light:#9A9A9A;
      --success:#22C55E;--gold:#F0B840;
      /* legacy aliases so checkout/cart still work */
      --blush:var(--pink);--blush-dark:var(--pink-dark);--blush-light:#FFB3CE;--blush-xlight:#FFF0F7;
      --cream:var(--gray-bg);--cream-dark:var(--gray-card);--cream-border:var(--gray-mid);
      --border:var(--gray-mid);--lavender:#8B6BD4;--lav-light:#E8E2FF;--lav-xlight:#F5F2FF;
      --cherry:var(--pink);
      --font-body:'Anybody',system-ui,sans-serif;
      --font-display:'Anybody',system-ui,sans-serif;
      --font-pixel:'Press Start 2P',monospace;
      --r-sm:4px;--r-md:8px;--r-lg:10px;--r-xl:12px;--r-pill:9999px;
      --shadow:4px 4px 0 var(--ink);--shadow-hover:6px 6px 0 var(--ink);
      --shadow-card:var(--shadow);--shadow-float:var(--shadow);
      --shadow-nav:none;--shadow-modal:8px 8px 0 var(--ink);
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background-color:var(--gray-bg);background-image:linear-gradient(rgba(26,26,26,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(26,26,26,0.045) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
    #root{min-height:100vh}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;font-family:inherit;border:none;background:none}
    input,textarea{font-family:inherit}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

    .navbar{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--white);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:2px solid var(--ink)}
    .navbar__logo{display:flex;align-items:center;gap:10px;font-family:var(--font-pixel);font-size:11px;color:var(--ink);cursor:pointer;letter-spacing:0}
    .navbar__logo-icon{width:36px;height:36px;background:var(--pink);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:18px}
    .navbar__cart-btn{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--pink);border-radius:var(--r-sm);color:var(--white);transition:background 0.2s,transform 0.15s}
    .navbar__cart-btn:hover{background:var(--pink-dark)}
    .navbar__cart-btn:active{transform:scale(0.95)}
    .cart-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;background:var(--pink);color:white;font-size:10px;font-weight:700;border-radius:0;display:flex;align-items:center;justify-content:center;animation:badgePop 0.3s cubic-bezier(0.34,1.56,0.64,1);border:2px solid var(--ink)}
    @keyframes badgePop{from{transform:scale(0.3);opacity:0}to{transform:scale(1);opacity:1}}

    .page{padding-top:68px;min-height:100vh}
    .page-inner{max-width:1180px;margin:0 auto;padding:0 20px}
    .page-fade{animation:pageIn 0.35s ease}
    @keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .toast-container{position:fixed;top:84px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{background:var(--ink);color:white;padding:12px 18px;border-radius:var(--r-lg);font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(28,17,24,0.25);animation:toastIn 0.35s cubic-bezier(0.34,1.56,0.64,1);max-width:320px}
    @keyframes toastIn{from{transform:translateX(60px) scale(0.9);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--r-sm);font-size:14px;font-weight:600;transition:all 0.15s;white-space:nowrap;cursor:pointer;border:none;font-family:var(--font-body)}
    .btn:active{transform:translate(2px,2px)}
    .btn--primary{background:var(--pink);color:white;border:2px solid var(--ink);box-shadow:var(--shadow)}
    .btn--primary:hover{background:var(--pink-dark);transform:translate(-2px,-2px);box-shadow:var(--shadow-hover)}
    .btn--ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
    .btn--ghost:hover{background:var(--gray-light);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
    .btn--lg{padding:14px 28px;font-size:15px}
    .btn--sm{padding:8px 14px;font-size:13px}
    .btn:disabled{opacity:0.45;pointer-events:none}

    /* HOME */
    .hero{padding:56px 0 40px;text-align:center}
    .hero__eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--white);border:none;padding:8px 16px;border-radius:0;font-family:var(--font-pixel);font-size:8px;font-weight:400;margin-bottom:22px;letter-spacing:0.5px}
    .hero__title{font-family:var(--font-body);font-size:clamp(32px,5vw,56px);font-weight:800;line-height:1.1;letter-spacing:-1.5px;max-width:700px;margin:0 auto 16px;color:var(--ink)}
    .hero__title em{font-style:normal;color:var(--pink)}
    .hero__subtitle{color:var(--muted);font-size:16px;max-width:460px;margin:0 auto 32px;line-height:1.7}
    .hero__actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    .filter-bar{display:flex;gap:8px;padding:24px 0 20px;overflow-x:auto;scrollbar-width:none}
    .filter-bar::-webkit-scrollbar{display:none}
    .filter-pill{padding:8px 16px;border-radius:0;font-family:var(--font-pixel);font-size:8px;font-weight:400;background:var(--white);color:var(--muted);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);transition:all 0.15s;white-space:nowrap;cursor:pointer}
    .filter-pill:hover{background:var(--gray-light);color:var(--ink)}
    .filter-pill.active{background:var(--pink);color:white;box-shadow:var(--shadow)}
    .cake-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding-bottom:48px}
    .cake-card{background:var(--white);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow);border:2px solid var(--ink);transition:transform 0.15s,box-shadow 0.15s;cursor:pointer}
    .cake-card:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-hover)}
    .cake-card__visual{background:var(--gray-card);height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-bottom:2px solid var(--ink)}
    .cake-card__visual::before{display:none}
    .cake-card__badge{position:absolute;top:10px;left:10px;padding:4px 8px;background:var(--ink);border-radius:0;font-family:var(--font-pixel);font-size:7px;font-weight:400;color:var(--white)}
    .cake-card__popular{position:absolute;top:10px;right:10px;background:var(--pink);padding:4px 8px;border-radius:0;font-family:var(--font-pixel);font-size:7px;font-weight:400;color:white}
    .cake-card__body{padding:16px 18px 18px}
    .cake-card__name{font-family:var(--font-body);font-size:16px;font-weight:700;line-height:1.3;margin-bottom:4px}
    .cake-card__tagline{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
    .cake-card__footer{display:flex;align-items:center;justify-content:space-between}
    .cake-card__price{font-family:var(--font-pixel);font-size:12px;font-weight:400;color:var(--pink)}
    .cake-card__price span{font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--muted)}

    /* PRODUCT */
    .product-page{padding-top:64px;min-height:100vh}
    .product-layout{display:block;padding:32px 20px 48px;max-width:1100px;margin:0 auto}
    @media(min-width:900px){.product-layout{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:48px}}
    .product-visual{display:flex;flex-direction:column;align-items:center;background:var(--gray-card);justify-content:center;border:2px solid var(--ink);box-shadow:var(--shadow);border-radius:var(--r-lg);padding:24px;min-height:260px;margin-bottom:32px}
    @media(min-width:900px){.product-visual{position:sticky;top:84px;padding:40px 24px;min-height:400px;margin-bottom:0}}
    /* mobile: only the top back button, hide panel's back */
    .product-back-top{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:16px;background:none;border:none;cursor:pointer;padding:0;transition:color 0.2s}
    .product-back-top:hover{color:var(--pink)}
    @media(min-width:900px){.product-back-top{display:none}}
    .product-visual__hint{margin-top:16px;font-family:var(--font-pixel);font-size:7px;color:var(--muted);text-align:center;letter-spacing:0.5px}
    .product-visual__img-wrap{position:relative;width:100%;max-width:420px;margin:0 auto}
    .product-visual__photo{width:100%;object-fit:contain;display:block}
    .product-visual__cream-overlay{position:absolute;inset:0;mix-blend-mode:color;opacity:0.55;pointer-events:none;border-radius:4px;transition:background 0.4s ease}
    .product-panel__back{display:none;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:20px;transition:color 0.2s}
    @media(min-width:900px){.product-panel__back{display:inline-flex}}
    .product-panel__back:hover{color:var(--pink)}
    .product-panel__name{font-family:var(--font-body);font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-0.5px;margin-bottom:6px}
    .product-panel__price{font-family:var(--font-pixel);font-size:16px;font-weight:400;color:var(--pink);margin-bottom:12px}
    .product-panel__desc{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:28px}
    .section-label{font-family:var(--font-pixel);font-size:8px;font-weight:400;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
    .cream-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
    .cream-pill{display:flex;align-items:center;gap:7px;padding:9px 14px;background:var(--white);border:2px solid var(--ink);border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:all 0.15s;font-family:var(--font-body);box-shadow:2px 2px 0 var(--ink)}
    .cream-pill:hover{background:var(--gray-light)}
    .cream-pill.selected{background:var(--pink);border-color:var(--pink);color:white;box-shadow:var(--shadow)}
    .cream-pill__dot{width:12px;height:12px;border-radius:2px;border:1.5px solid rgba(0,0,0,0.15);flex-shrink:0}
    .field-group{margin-bottom:20px}
    .field-label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
    .field-label span{font-size:12px;font-weight:400;color:var(--muted-light)}
    .field-input{width:100%;padding:11px 13px;background:var(--white);border:2px solid var(--ink);border-radius:var(--r-sm);font-size:14px;color:var(--ink);transition:border-color 0.2s,box-shadow 0.2s;outline:none;resize:vertical;min-height:76px;font-family:var(--font-body)}
    .field-input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,45,120,0.12)}
    .field-input::placeholder{color:var(--muted-light)}
    .quantity-row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .qty-label{font-size:13px;font-weight:600;color:var(--ink-soft)}
    .qty-control{display:flex;align-items:center;background:var(--gray-card);border-radius:var(--r-sm);overflow:hidden;border:2px solid var(--ink)}
    .qty-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);transition:background 0.15s,color 0.15s}
    .qty-btn:hover{background:var(--gray-mid);color:var(--ink)}
    .qty-value{min-width:32px;text-align:center;font-size:15px;font-weight:700}

    /* CART */
    .cart-layout{display:grid;grid-template-columns:1fr;gap:24px;padding:32px 20px 48px;max-width:960px;margin:0 auto}
    @media(min-width:768px){.cart-layout{grid-template-columns:1fr 340px;align-items:start}}
    .section-title{font-family:var(--font-body);font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:20px}
    .cart-item{display:flex;gap:14px;background:var(--white);border-radius:var(--r-md);padding:14px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);margin-bottom:12px;transition:transform 0.15s,box-shadow 0.15s}
    .cart-item:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
    .cart-item__thumb{width:80px;height:80px;background:var(--gray-card);border-radius:var(--r-sm);border:2px solid var(--ink);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .cart-item__body{flex:1;min-width:0}
    .cart-item__name{font-weight:700;font-size:15px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cart-item__detail{font-size:12px;color:var(--muted);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cart-item__actions{display:flex;align-items:center;gap:8px}
    .cart-item__price{font-family:var(--font-pixel);font-size:12px;font-weight:400;color:var(--pink);text-align:right;flex-shrink:0;padding-top:2px}
    .cart-item__remove{color:var(--muted-light);font-size:12px;transition:color 0.2s}
    .cart-item__remove:hover{color:#D44}
    .promo-banner{background:var(--ink);border:2px solid var(--ink);border-radius:var(--r-md);padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;box-shadow:var(--shadow)}
    .promo-banner__icon{font-size:20px}
    .promo-banner__text{font-size:13px;color:var(--white);font-weight:500}
    .cart-summary{background:var(--white);border-radius:var(--r-md);padding:22px;border:2px solid var(--ink);box-shadow:var(--shadow);position:sticky;top:84px}
    .cart-summary__title{font-family:var(--font-body);font-size:18px;font-weight:800;margin-bottom:16px}
    .summary-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:10px}
    .summary-row.total{border-top:2px solid var(--ink);padding-top:12px;margin-top:4px;font-size:17px;font-weight:700;color:var(--ink)}
    .summary-row.total .value{font-family:var(--font-pixel);font-size:14px;color:var(--pink)}
    .cart-empty{text-align:center;padding:64px 20px}
    .cart-empty__icon{font-size:64px;margin-bottom:16px}
    .cart-empty__title{font-family:var(--font-body);font-size:22px;font-weight:800;margin-bottom:8px}
    .cart-empty__desc{color:var(--muted);font-size:15px;margin-bottom:24px}

    /* CHECKOUT */
    .checkout-page{padding-top:64px;min-height:100vh}
    .checkout-inner{max-width:760px;margin:0 auto;padding:32px 20px 48px}
    .progress-steps{display:flex;align-items:center;margin-bottom:36px}
    .step{display:flex;align-items:center;gap:8px;font-family:var(--font-pixel);font-size:8px;font-weight:400;color:var(--muted-light)}
    .step.active{color:var(--pink)}
    .step.done{color:var(--success)}
    .step__dot{width:28px;height:28px;border-radius:0;background:var(--gray-card);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
    .step.active .step__dot{background:var(--pink);border-color:var(--pink);color:white}
    .step.done .step__dot{background:var(--success);border-color:var(--success);color:white}
    .step-connector{flex:1;height:2px;background:var(--gray-mid);margin:0 8px}
    .step-connector.done{background:var(--success)}
    .section-card{background:var(--white);border-radius:var(--r-md);border:2px solid var(--ink);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
    .section-card__header{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .contacts-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .contacts-scroll::-webkit-scrollbar{display:none}
    .contact-card{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 14px;background:var(--gray-card);border:2px solid var(--ink);border-radius:var(--r-sm);cursor:pointer;min-width:90px;transition:all 0.15s;box-shadow:2px 2px 0 var(--ink)}
    .contact-card:hover{background:var(--gray-light)}
    .contact-card.selected{border-color:var(--pink);background:#FFF0F5;box-shadow:2px 2px 0 var(--pink)}
    .contact-card__avatar{width:44px;height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:white}
    .contact-card__name{font-size:12px;font-weight:600;text-align:center;white-space:nowrap}
    .contact-card__sub{font-size:11px;color:var(--muted);text-align:center;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .add-contact-card{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 14px;background:transparent;border:2px dashed var(--gray-mid);border-radius:var(--r-sm);cursor:pointer;min-width:90px;transition:border-color 0.2s}
    .add-contact-card:hover{border-color:var(--pink)}
    .add-contact-card__icon{width:44px;height:44px;border-radius:var(--r-sm);background:var(--gray-card);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)}
    .add-contact-card__name{font-size:12px;font-weight:500;color:var(--muted)}
    .calendar{width:100%}
    .calendar__nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .calendar__month{font-size:14px;font-weight:700}
    .calendar__nav-btn{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
    .calendar__nav-btn:hover{background:var(--gray-card)}
    .calendar__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
    .calendar__dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted-light);padding:6px 0;text-transform:uppercase;letter-spacing:0.5px}
    .calendar__day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;border-radius:var(--r-sm);cursor:pointer;transition:all 0.15s}
    .calendar__day:hover:not(.disabled):not(.selected){background:var(--gray-light);color:var(--ink)}
    .calendar__day.today{outline:2px solid var(--pink);outline-offset:-2px;color:var(--pink);font-weight:700}
    .calendar__day.selected{background:var(--pink);color:white}
    .calendar__day.disabled{color:var(--gray-mid);cursor:not-allowed}
    .time-slots{display:flex;gap:8px;flex-wrap:wrap}
    .time-slot{padding:9px 16px;border-radius:var(--r-sm);border:2px solid var(--ink);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;background:var(--white);font-family:var(--font-body);box-shadow:2px 2px 0 var(--ink)}
    .time-slot:hover{background:var(--gray-light)}
    .time-slot.selected{background:var(--pink);border-color:var(--pink);color:white;box-shadow:2px 2px 0 var(--pink-dark)}
    .payment-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--gray-card);border:2px solid var(--ink);border-radius:var(--r-sm);cursor:pointer;margin-bottom:8px;transition:all 0.15s;box-shadow:2px 2px 0 var(--ink)}
    .payment-card:hover{background:var(--gray-light)}
    .payment-card.selected{border-color:var(--pink);background:#FFF0F5;box-shadow:2px 2px 0 var(--pink)}
    .payment-card__icon{width:44px;height:32px;background:var(--white);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--gray-mid)}
    .payment-card__info{flex:1}
    .payment-card__number{font-size:14px;font-weight:600}
    .payment-card__expiry{font-size:12px;color:var(--muted)}
    .payment-card__radio{width:20px;height:20px;border-radius:0;border:2px solid var(--gray-mid);display:flex;align-items:center;justify-content:center}
    .payment-card.selected .payment-card__radio{border-color:var(--pink)}
    .payment-card.selected .payment-card__radio::after{content:'';width:10px;height:10px;border-radius:0;background:var(--pink)}
    .checkout-footer{display:flex;gap:12px;padding-top:8px}
    .checkout-footer .btn{flex:1}
    .divider{height:2px;background:var(--ink);margin:16px 0}

    /* CONFIRMATION */

// ── ROUTER ────────────────────────────────────────────────────────────────────
const RouterCtx = createContext(null);
function useRouter() { return useContext(RouterCtx); }

function Router({ children }) {
  const [path, setPath] = useState(() => window.location.hash.replace('#','') || '/');
  useEffect(() => {
    const h = () => setPath(window.location.hash.replace('#','') || '/');
    window.addEventListener('hashchange', h);
    return () => window.removeEventListener('hashchange', h);
  }, []);
  const navigate = useCallback(p => { window.location.hash = p; }, []);
  const params = {};
  if (path.startsWith('/cake/')) params.id = path.replace('/cake/','');
  return h(RouterCtx.Provider, { value: { path, navigate, params } }, children);
}

// ── CONTEXT ───────────────────────────────────────────────────────────────────
const CartCtx = createContext(null);
const CheckoutCtx = createContext(null);
const ToastCtx = createContext(null);

function useLS(key, init) {
  const [v, setV] = useState(() => { try { const s=localStorage.getItem(key); return s?JSON.parse(s):init; } catch{return init;} });
  useEffect(() => { try{localStorage.setItem(key,JSON.stringify(v));}catch{} }, [key,v]);
  return [v, setV];
}

function CartProvider({ children }) {
  const [items, setItems] = useLS('ss_cart', []);
  const add = useCallback(item => setItems(p => {
    const i = p.findIndex(x => x.cakeId===item.cakeId && x.cream===item.cream);
    if (i>=0) { const n=[...p]; n[i]={...n[i],qty:n[i].qty+item.qty}; return n; }
    return [...p, {...item, id:Date.now().toString()}];
  }), [setItems]);
  const remove = useCallback(id => setItems(p=>p.filter(x=>x.id!==id)), [setItems]);
  const setQty = useCallback((id,q) => { if(q<1)return; setItems(p=>p.map(x=>x.id===id?{...x,qty:q}:x)); }, [setItems]);
  const clear = useCallback(() => setItems([]), [setItems]);
  const sub = items.reduce((s,x)=>s+x.price*x.qty,0);
  const fee = sub>=400?0:30;
  const total = sub+fee;
  const count = items.reduce((s,x)=>s+x.qty,0);
  return h(CartCtx.Provider, {value:{items,add,remove,setQty,clear,sub,fee,total,count}}, children);
}
function useCart() { return useContext(CartCtx); }

function CheckoutProvider({ children }) {
  const [s, setS] = useState({ recipientId:null, date:null, time:null, cardId:'card1' });
  const upd = p => setS(v=>({...v,...p}));
  const reset = () => setS({ recipientId:null, date:null, time:null, cardId:'card1' });
  return h(CheckoutCtx.Provider, {value:{...s,upd,reset}}, children);
}
function useCheckout() { return useContext(CheckoutCtx); }

function ToastProvider({ children }) {
  const [list, setList] = useState([]);
  const show = useCallback((msg,icon='✓') => {
    const id=Date.now();
    setList(p=>[...p,{id,msg,icon}]);
    setTimeout(()=>setList(p=>p.filter(t=>t.id!==id)),2600);
  },[]);
  return h(ToastCtx.Provider, {value:{show}},

// ── CALENDAR ──────────────────────────────────────────────────────────────────
function Calendar({ value, onChange }) {
  const today = new Date();
  const [yr, setYr] = useState(today.getFullYear());
  const [mo, setMo] = useState(today.getMonth());
  const days = new Date(yr,mo+1,0).getDate();
  const first = new Date(yr,mo,1).getDay();
  const cells = [...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];
  const isPast = d => new Date(yr,mo,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const isToday = d => yr===today.getFullYear()&&mo===today.getMonth()&&d===today.getDate();
  const isSel = d => value===`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const prev = () => mo===0?(setMo(11),setYr(y=>y-1)):setMo(m=>m-1);
  const next = () => mo===11?(setMo(0),setYr(y=>y+1)):setMo(m=>m+1);
  return h('div',{className:'calendar'},
    h('div',{className:'calendar__nav'},
      h('button',{className:'calendar__nav-btn',onClick:prev},'‹'),
      h('span',{className:'calendar__month'},MONTHS[mo],' ',yr),
      h('button',{className:'calendar__nav-btn',onClick:next},'›')
    ),
    h('div',{className:'calendar__grid'},
      DOW.map(d=>h('div',{key:d,className:'calendar__dow'},d)),
      cells.map((d,i)=>{
        if(!d) return h('div',{key:'e'+i,className:'calendar__day'});
        const cls=['calendar__day',isPast(d)&&'disabled',isToday(d)&&!isSel(d)&&'today',isSel(d)&&'selected'].filter(Boolean).join(' ');
        return h('div',{key:d,className:cls,onClick:()=>!isPast(d)&&onChange(`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`)},d);
      })
    )
  );
}

        h(Calendar,{value:date,onChange:d=>upd({date:d})})
      ),
      h('div',{className:'section-card'},
        h('div',{className:'section-card__header'},'🕐 Delivery Time'),
        h('div',{className:'time-slots'},
          SLOTS.map(t=>h('button',{key:t,className:`time-slot${time===t?' selected':''}`,onClick:()=>upd({time:t})},t))
        )
      ),
      h('div',{className:'checkout-footer'},
        h('button',{className:'btn btn--ghost',onClick:()=>navigate('/cart')},'← Back'),
        h('button',{className:'btn btn--primary btn--lg',disabled:!ok,onClick:()=>navigate('/checkout/payment')},'Continue to Payment →')
      )
    )
  );
}

// ── CHECKOUT PAYMENT ──────────────────────────────────────────────────────────
function CheckoutPayment() {
  const { navigate } = useRouter();
  const { cardId, upd } = useCheckout();
  const { items, total, clear } = useCart();
  const { show } = useToast();
  const [modal, setModal] = useState(false);
  const [card, setCard] = useState({num:'',exp:'',cvv:'',name:''});
  const finish = () => { navigate('/order-confirmation'); setTimeout(clear,300); };
  return h('div',{className:'checkout-page page-fade'},
    h('div',{className:'checkout-inner'},
      h('div',{className:'progress-steps'},
        h('div',{className:'step done'},h('div',{className:'step__dot'},'✓'),h('span',null,'Delivery')),
        h('div',{className:'step-connector done'}),
        h('div',{className:'step active'},h('div',{className:'step__dot'},'2'),h('span',null,'Payment')),
        h('div',{className:'step-connector'}),
        h('div',{className:'step'},h('div',{className:'step__dot'},'3'),h('span',null,'Confirm'))
      ),
      h('h1',{className:'section-title'},'How would you like to pay?'),
      h('div',{className:'section-card'},
        h('div',{className:'section-card__header'},'💳 Saved Payment Methods'),
        SAVED_CARDS.map(c=>h('div',{key:c.id,className:`payment-card${cardId===c.id?' selected':''}`,onClick:()=>upd({cardId:c.id})},
          h('div',{className:'payment-card__icon'},c.brand==='Visa'?'💙':'🟠'),
          h('div',{className:'payment-card__info'},
            h('div',{className:'payment-card__number'},c.brand,' •••• ',c.last4),
            h('div',{className:'payment-card__expiry'},'Expires ',c.exp)
          ),
          h('div',{className:'payment-card__radio'})
        )),
        h('button',{className:'btn btn--ghost',style:{width:'100%',marginTop:8},onClick:()=>setModal(true)},'+ Add New Card')
      ),
      h('div',{className:'section-card'},
        h('div',{className:'section-card__header'},'🧾 Order Summary'),
        items.map(it=>h('div',{key:it.id,style:{display:'flex',justifyContent:'space-between',fontSize:14,marginBottom:8,color:'var(--ink-soft)'}},
          h('span',null,it.cakeName,' × ',it.qty),
          h('span',{style:{fontWeight:600}},'₪',it.price*it.qty)
        )),
        h('div',{className:'divider'}),
        h('div',{style:{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:16}},
          h('span',null,'Total'),h('span',{style:{color:'var(--blush)'}},'₪',total)
        )
      ),
      h('div',{className:'checkout-footer'},
        h('button',{className:'btn btn--ghost',onClick:()=>navigate('/checkout/delivery')},'← Back'),
        h('button',{className:'btn btn--primary btn--lg',disabled:!cardId,onClick:finish},'🎉 Complete Order')
      )
    ),
    modal && h('div',{className:'modal-overlay',onClick:e=>e.target===e.currentTarget&&setModal(false)},
      h('div',{className:'modal'},
        h('div',{className:'modal__header'},
          h('span',{className:'modal__title'},'Add New Card'),
          h('button',{className:'modal__close',onClick:()=>setModal(false)},'×')
        ),
        h('div',{className:'modal__field'},h('label',null,'Card Number'),h('input',{className:'modal__input',placeholder:'1234 5678 9012 3456',value:card.num,onChange:e=>setCard(p=>({...p,num:e.target.value})),maxLength:19})),
        h('div',{className:'modal__row'},
          h('div',{className:'modal__field'},h('label',null,'Expiry'),h('input',{className:'modal__input',placeholder:'MM/YY',value:card.exp,onChange:e=>setCard(p=>({...p,exp:e.target.value})),maxLength:5})),
          h('div',{className:'modal__field'},h('label',null,'CVV'),h('input',{className:'modal__input',placeholder:'123',value:card.cvv,onChange:e=>setCard(p=>({...p,cvv:e.target.value})),maxLength:4}))
        ),
        h('div',{className:'modal__field'},h('label',null,'Cardholder Name'),h('input',{className:'modal__input',placeholder:'Full name on card',value:card.name,onChange:e=>setCard(p=>({...p,name:e.target.value}))})),
        h('button',{className:'btn btn--primary',style:{width:'100%',marginTop:8},onClick:()=>{show('Card saved!','✅');setModal(false);}},'Save Card')
      )
    )
  );
}

// ── CONFIRMATION ──────────────────────────────────────────────────────────────
function ConfettiComp() {
  const pieces = Array.from({length:45},(_,i)=>({id:i,color:CONFETTI_CLR[i%CONFETTI_CLR.length],left:`${(i*2.22)%100}%`,delay:`${(i*0.06)%2}s`,dur:`${2.4+(i%6)*0.3}s`,size:8+(i%5)*2,br:i%3===0?'50%':i%3===1?'2px':'1px'}));
  return h('div',{className:'confetti-container'},
    pieces.map(p=>h('div',{key:p.id,className:'confetti-piece',style:{left:p.left,top:'-20px',width:p.size,height:p.size,background:p.color,borderRadius:p.br,animationName:'confettiFall',animationDuration:p.dur,animationDelay:p.delay,animationFillMode:'both',animationTimingFunction:'linear'}}))
  );
}

function ConfirmationPage() {
  const { navigate } = useRouter();
  const { recipientId, date, time, reset } = useCheckout();
  const r = CONTACTS.find(c=>c.id===recipientId);
  const fmt = iso => { if(!iso)return'—'; const[y,m,d]=iso.split('-'); return `${d} ${MONTHS[parseInt(m)-1]} ${y}`; };
  const [orderNum] = useState(()=>'#SS'+Math.floor(Math.random()*9000+1000));
  return h('div',{className:'confirmation-page page-fade'},
    h(ConfettiComp),
    h('div',{className:'confirmation-inner'},
      h('div',{className:'confirmation-icon'},'🎂'),
      h('h1',{className:'confirmation-title'},'Order Placed!'),
      h('p',{className:'confirmation-subtitle'},'Your cake is being baked with love. We\'ll send you a confirmation shortly.'),
      h('div',{className:'confirmation-card'},
        h('div',{className:'conf-row'},h('span',null,'Recipient'),h('span',{className:'val'},r?.name||'—')),
        h('div',{className:'conf-row'},h('span',null,'Address'),h('span',{className:'val'},r?.addr||'—')),
        h('div',{className:'conf-row'},h('span',null,'Delivery Date'),h('span',{className:'val'},fmt(date))),
        h('div',{className:'conf-row'},h('span',null,'Delivery Time'),h('span',{className:'val'},time||'—')),
        h('div',{className:'conf-row'},h('span',null,'Order #'),h('span',{className:'val'},orderNum))
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:10,animation:'fadeUp 0.5s ease 1s both'}},
        h('button',{className:'btn btn--primary btn--lg',onClick:()=>{reset();navigate('/');}},  '🎁 Order Another Cake'),
        h('button',{className:'btn btn--ghost',onClick:()=>navigate('/')},'Back to Home')
      )
    )
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const { path } = useRouter();
  let page;
  if (path==='/') page = h(HomePage);
  else if (path==='/build') page = h(BuildPage);
  else if (path.startsWith('/cake/')) page = h(ProductPage);
  else if (path==='/cart') page = h(CartPage);
  else if (path==='/checkout/delivery') page = h(CheckoutDelivery);
  else if (path==='/checkout/payment') page = h(CheckoutPayment);
  else if (path==='/order-confirmation') page = h(ConfirmationPage);
  else page = h(HomePage);

  return h(React.Fragment, null, h(NavBar), page);
}

function Root() {
  return h(Router, null,
    h(CartProvider, null,
      h(CheckoutProvider, null,
        h(ToastProvider, null,
          h(App)
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(Root));
</script>
</body>
</html>
